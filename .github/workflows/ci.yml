name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build, Typecheck & PostGIS E2E Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Stop host PostgreSQL to free port 5432
        run: sudo systemctl stop postgresql || true

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build

      - name: Typecheck workspaces and E2E suite
        run: npm run typecheck

      - name: Run unit and PostGIS integration tests
        run: npm test
