# GDPR storage limitation: rotate container logs (json-file, 3 x 10 MB per service)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgis:
    logging: *default-logging
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ppgis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppgis}
      POSTGRES_DB: ${POSTGRES_DB:-ppgis}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ppgis} -d ${POSTGRES_DB:-ppgis}"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    logging: *default-logging
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  api:
    logging: *default-logging
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ppgis}:${POSTGRES_PASSWORD:-ppgis}@postgis:5432/${POSTGRES_DB:-ppgis}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://127.0.0.1:3000}"
      UPLOADS_DIR: "/var/lib/entsiegelung/uploads"
      AUTO_SEED_VG250: "${AUTO_SEED_VG250:-true}"
      SMTP_HOST: "${SMTP_HOST:-mailpit}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_REQUIRE_TLS: "${SMTP_REQUIRE_TLS:-false}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-OpenUnseal <noreply@localhost>}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      OSM_STYLE_URL: "${OSM_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}"
      OSM_DARK_STYLE_URL: "${OSM_DARK_STYLE_URL:-}"
      ORTHOPHOTO_URL_TEMPLATE: "${ORTHOPHOTO_URL_TEMPLATE:-}"
      ORTHOPHOTO_TILE_SIZE: "${ORTHOPHOTO_TILE_SIZE:-256}"
      ORTHOPHOTO_ATTRIBUTION: "${ORTHOPHOTO_ATTRIBUTION:-}"
      ORTHOPHOTO_BOUNDS: "${ORTHOPHOTO_BOUNDS:-}"
      ORTHOPHOTO_MAX_ZOOM: "${ORTHOPHOTO_MAX_ZOOM:-20}"
      INITIAL_LNG: "${INITIAL_LNG:-8.2739}"
      INITIAL_LAT: "${INITIAL_LAT:-49.9989}"
      INITIAL_ZOOM: "${INITIAL_ZOOM:-15}"
      MAX_DAILY_POLYGONS_PER_USER: "${MAX_DAILY_POLYGONS_PER_USER:-25}"
      SESSION_TTL_DAYS: "${SESSION_TTL_DAYS:-30}"
      # Anti-spam & moderation (registration proof-of-work, disposable domains, jurisdiction, pruning, new-user badge)
      AUTH_CAPTCHA_ENABLED: "${AUTH_CAPTCHA_ENABLED:-false}"
      AUTH_CAPTCHA_SECRET: "${AUTH_CAPTCHA_SECRET:-}"
      AUTH_CAPTCHA_MAX_NUMBER: "${AUTH_CAPTCHA_MAX_NUMBER:-15000}"
      DISPOSABLE_EMAIL_BLOCKLIST_EXTRA: "${DISPOSABLE_EMAIL_BLOCKLIST_EXTRA:-}"
      REQUIRE_JURISDICTION: "${REQUIRE_JURISDICTION:-when_seeded}"
      STALE_UNRATED_PRUNE_DAYS: "${STALE_UNRATED_PRUNE_DAYS:-30}"
      NEW_USER_MIN_ACCOUNT_DAYS: "${NEW_USER_MIN_ACCOUNT_DAYS:-14}"
      NEW_USER_MIN_CLEAN_POLYGONS: "${NEW_USER_MIN_CLEAN_POLYGONS:-3}"
      DISCLAIMER_TEXT: "${DISCLAIMER_TEXT:-Community unsealing suggestions - non-binding public input, regardless of property ownership.}"
      OPERATOR_NAME: "${OPERATOR_NAME:-}"
      OPERATOR_ADDRESS: "${OPERATOR_ADDRESS:-}"
      OPERATOR_EMAIL: "${OPERATOR_EMAIL:-}"
      OPERATOR_PHONE: "${OPERATOR_PHONE:-}"
      ABUSE_CONTACT: "${ABUSE_CONTACT:-}"
      BUG_REPORT_TO: "${BUG_REPORT_TO:-}"
      IMPRESSUM_URL: "${IMPRESSUM_URL:-}"
      PRIVACY_POLICY_URL: "${PRIVACY_POLICY_URL:-}"
      TERMS_URL: "${TERMS_URL:-}"
      LICENSES_URL: "${LICENSES_URL:-}"
      SOURCE_CODE_URL: "${SOURCE_CODE_URL:-https://github.com/severinbro/Unseal}"
      APK_DOWNLOAD_URL: "${APK_DOWNLOAD_URL:-}"
      APK_SHA256: "${APK_SHA256:-}"
      TOMBSTONE_SECRET: "${TOMBSTONE_SECRET:-dev-only-insecure-tombstone-secret-not-for-production}"
      PSEUDONYM_RESERVATION_DAYS: "${PSEUDONYM_RESERVATION_DAYS:-365}"
      PRIVACY_HOSTING_PROVIDER: "${PRIVACY_HOSTING_PROVIDER:-}"
      PRIVACY_EMAIL_PROVIDER: "${PRIVACY_EMAIL_PROVIDER:-}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-}"
      APP_NAME: "${APP_NAME:-}"
      APP_SUBTITLE_DE: "${APP_SUBTITLE_DE:-}"
      APP_SUBTITLE_EN: "${APP_SUBTITLE_EN:-}"
      BRAND_LOGO_FILE: "${BRAND_LOGO_FILE:-}"
      BRAND_LOGO_URL: "${BRAND_LOGO_URL:-}"
      BRAND_ACCENT_COLOR: "${BRAND_ACCENT_COLOR:-}"
      BRAND_ACCENT_DARK_COLOR: "${BRAND_ACCENT_DARK_COLOR:-}"
      INTRO_ENABLED: "${INTRO_ENABLED:-true}"
      MUNICIPAL_PORTAL_URL: "${MUNICIPAL_PORTAL_URL:-}"
      MUNICIPAL_PORTAL_LABEL: "${MUNICIPAL_PORTAL_LABEL:-}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
      WEBHOOK_EVENTS: "${WEBHOOK_EVENTS:-}"
      WEBHOOK_TIMEOUT_MS: "${WEBHOOK_TIMEOUT_MS:-5000}"
      WEBHOOK_ALLOW_PRIVATE_NETWORKS: "${WEBHOOK_ALLOW_PRIVATE_NETWORKS:-false}"
    volumes:
      - uploads_data:/var/lib/entsiegelung/uploads
    depends_on:
      postgis:
        condition: service_healthy
      mailpit:
        condition: service_started
    mem_limit: 768m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  uploads_data:
